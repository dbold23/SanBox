[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-rag"
version = "2.0.0"
description = "Ask questions about the lab's papers, with citations. Papers live on the NAS or Google Drive; the index lives next to them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # documents
    "pymupdf>=1.24",          # PDF text extraction (fast, no ML models)
    "python-docx>=1.1",       # .docx
    # index
    "numpy>=1.26",
    # embeddings (local, no account or GPU needed; downloads a ~130 MB model once)
    "fastembed>=0.4",
    # answering
    "anthropic>=1.0",
    "httpx>=0.27",            # Ollama / OpenAI-compatible HTTP
    # Google Drive
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
    # web UI
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
labrag = "labrag.cli:main"

[tool.setuptools.packages.find]
include = ["labrag*"]

[tool.setuptools.package-data]
labrag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["RUF007", "SIM108", "SIM105", "B008", "RUF012", "E501"]
